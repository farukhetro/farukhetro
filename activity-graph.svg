<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- horizontal grid lines -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="50" y1="30" x2="730" y2="30"/>
    <line x1="50" y1="80" x2="730" y2="80"/>
    <line x1="50" y1="130" x2="730" y2="130"/>
    <line x1="50" y1="180" x2="730" y2="180"/>
    <line x1="50" y1="205" x2="730" y2="205"/>
  </g>

  <!-- y-axis labels -->
  <g fill="#8b949e" font-size="11">
    <text x="10" y="34">High</text>
    <text x="10" y="134">Avg</text>
    <text x="10" y="209">Low</text>
  </g>

  <!-- area under curve -->
  <path d="M50,150 L100,90 L150,160 L200,60 L250,175 L300,110 L350,145 L400,55 L450,165 L500,120 L550,85 L600,175 L650,50 L700,130 L730,100
           L730,205 L50,205 Z" fill="url(#areaFill)"/>

  <!-- main line -->
  <polyline points="50,150 100,90 150,160 200,60 250,175 300,110 350,145 400,55 450,165 500,120 550,85 600,175 650,50 700,130 730,100"
            fill="none" stroke="#2ea043" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- data points -->
  <g fill="#c9d1d9" stroke="#2ea043" stroke-width="1.5">
    <circle cx="50" cy="150" r="4"/>
    <circle cx="100" cy="90" r="4"/>
    <circle cx="150" cy="160" r="4"/>
    <circle cx="200" cy="60" r="5.5"/>
    <circle cx="250" cy="175" r="4"/>
    <circle cx="300" cy="110" r="4"/>
    <circle cx="350" cy="145" r="4"/>
    <circle cx="400" cy="55" r="5.5"/>
    <circle cx="450" cy="165" r="4"/>
    <circle cx="500" cy="120" r="4"/>
    <circle cx="550" cy="85" r="4"/>
    <circle cx="600" cy="175" r="4"/>
    <circle cx="650" cy="50" r="5.5"/>
    <circle cx="700" cy="130" r="4"/>
  </g>

  <!-- x-axis day labels -->
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="50" y="222">Mon</text>
    <text x="150" y="222">Wed</text>
    <text x="250" y="222">Fri</text>
    <text x="350" y="222">Sun</text>
    <text x="450" y="222">Tue</text>
    <text x="550" y="222">Thu</text>
    <text x="650" y="222">Sat</text>
  </g>

  <!-- baseline -->
  <line x1="50" y1="205" x2="730" y2="205" stroke="#484f58" stroke-width="1"/>
</svg>
